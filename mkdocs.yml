site_name: Datafast
site_description: Pipeline-first synthetic data generation for Python
site_author: Patrick Fleith
site_url: https://patrickfleith.github.io/datafast/

repo_name: patrickfleith/datafast
repo_url: https://github.com/patrickfleith/datafast

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tabs
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: black
      accent: teal

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
  - def_list
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Glossary: glossary.md
  - Guides:
      - guides/index.md
      - Building Pipelines: guides/building_pipelines.md
      - LLM Steps: guides/llm_steps.md
      - Checkpointing: guides/checkpointing.md
      - Langfuse Tracing: guides/langfuse_tracing.md
  - Cookbook:
      - cookbook/index.md
      - Text Classification: cookbook/text_classification.md
      - Persona Generation: cookbook/persona_generation.md
      - Space Engineering Text Generation: cookbook/space_text_generation.md
  - Served models guide: llms.md
  - Models: models.md
  - Reference:
      - Sources & Seed: reference/sources_and_seed.md
      - Data ops: reference/data_ops.md
      - Sample: reference/sample.md
      - LLM step: reference/llm_step.md
      - Specialized LLM steps: reference/llm_specialized.md
      - Branching: reference/branching.md
      - Sinks: reference/sinks.md
      - Served models: reference/served_models.md
      - Providers:
          - OpenAI: reference/providers/openai.md
          - Anthropic: reference/providers/anthropic.md
          - Gemini: reference/providers/gemini.md
          - Mistral: reference/providers/mistral.md
          - OpenRouter: reference/providers/openrouter.md
          - Ollama: reference/providers/ollama.md
          - OpenAI-compatible: reference/providers/openai_compatible.md
  - API: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_section_style: table
            # Several steps carry their parameter docs on __init__ rather than the
            # class (Filter, Group, Pair); merging surfaces them on one heading.
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 3
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_source: false
            filters: ["!^_"]
