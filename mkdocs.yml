site_name: Datafast
site_description: Pipeline-first synthetic data generation for Python
site_author: Patrick Fleith
site_url: https://patrickfleith.github.io/datafast/

repo_name: patrickfleith/datafast
repo_url: https://github.com/patrickfleith/datafast

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tabs
    - search.highlight
    - toc.follow
  # Two entries make the palette a toggle rather than a fixed scheme. Each `media`
  # picks the entry that matches the reader's OS setting on first visit; the toggle
  # then overrides it and the choice is remembered. `primary` and `accent` are the
  # same in both so only the background and text invert.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
  - def_list
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Quickstart: quickstart.md
      - Concepts: concepts.md
      - Glossary: glossary.md
      - What's in v1: whats_in_v1.md
  - Guides:
      - guides/index.md
      - Pipelines & execution: guides/pipelines_and_execution.md
      - Structured output: guides/structured_output.md
      - Multimodal input: guides/multimodal_input.md
      - Calling a served model: guides/calling_a_served_model.md
      - Error handling & troubleshooting: guides/troubleshooting.md
      - Served models guide: llms.md
      - Langfuse tracing: guides/langfuse_tracing.md
  - Reference:
      - Sources & Seed: reference/sources_and_seed.md
      - Data ops: reference/data_ops.md
      - Sample: reference/sample.md
      - LLM step: reference/llm_step.md
      - Specialized LLM steps: reference/llm_specialized.md
      - Branching: reference/branching.md
      - Sinks: reference/sinks.md
      - Served models: reference/served_models.md
      - Model defaults: models.md
      - Providers:
          - OpenAI: reference/providers/openai.md
          - Anthropic: reference/providers/anthropic.md
          - Gemini: reference/providers/gemini.md
          - Mistral: reference/providers/mistral.md
          - OpenRouter: reference/providers/openrouter.md
          - Ollama: reference/providers/ollama.md
          - OpenAI-compatible: reference/providers/openai_compatible.md
      - API: api.md
  - Cookbook:
      - cookbook/index.md
      - All examples: cookbook/examples.md
      - Text Classification: cookbook/text_classification.md
      - Persona Generation: cookbook/persona_generation.md
      - Space Engineering Text Generation: cookbook/space_text_generation.md
      - Preference Data with Scoring: cookbook/preference_with_scoring.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_section_style: table
            # Several steps carry their parameter docs on __init__ rather than the
            # class (Filter, Group, Pair); merging surfaces them on one heading.
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 3
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_source: false
            filters: ["!^_"]
