[pytest]
markers =
    integration: marks tests that require API connectivity (deselect with '-m "not integration"')
    live: marks tests that hit a real provider endpoint
    multimodal: marks tests that exercise multimodal provider behavior
    anthropic: marks tests that require a real Anthropic API key
    openai: marks tests that require a real OpenAI API key
    mistral: marks tests that require a real Mistral API key
    gemini: marks tests that require a real Gemini API key
    ollama: marks tests that require a real Ollama backend
    vllm: marks tests that require a real vLLM backend
    llamacpp: marks tests that require a real llama.cpp backend
    slow: marks tests that are slow to run

# Other pytest configurations
testpaths = tests
# Provider dirs under tests/live/ deliberately share module basenames
# (test_generation.py, test_reasoning.py, ...), which the default prepend
# import mode cannot disambiguate.
addopts = --import-mode=importlib
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Shows logs during test runs
log_cli = True
log_cli_level = INFO

# Filter out specific warnings
filterwarnings =
    # Ignore Pydantic deprecation warnings
    ignore::DeprecationWarning:pydantic.*:
    # Ignore Pydantic serializer warnings during tests
    ignore::UserWarning:pydantic.main
    # Ignore LiteLLM deprecation warnings
    ignore::DeprecationWarning:litellm.*:
    # Ignore HTTPX deprecation warnings
    ignore::DeprecationWarning:httpx.*:
    # Ignore importlib warnings
    ignore::DeprecationWarning:importlib_resources.*:
