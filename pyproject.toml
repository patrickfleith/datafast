[build-system]
requires = ["setuptools>=62.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datafast"
version = "1.0.0"
description = "Pipeline-first synthetic data generation for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Patrick Fleith" }
]
keywords = ["synthetic-data", "pipeline", "llm", "generation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# Every runtime dependency below is imported at module scope by the package.
# LiteLLM is the only LLM path: provider SDKs (anthropic, google-generativeai,
# openai) are not imported here — LiteLLM reaches those providers over its own
# HTTP transport. Optional file formats and Hub I/O live in the extras.
dependencies = [
    # Floor, not a pin: litellm 1.82.7 and 1.82.8 were published with malware,
    # so 1.83 is the oldest release that is known good. Do not lower it. The
    # upper bound is there because the provider adapters track litellm's API
    # closely enough that a 2.0 could break them on a fresh install.
    "litellm>=1.83,<2",
    "loguru",
    "pydantic",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
# Parquet I/O: `Source.parquet(...)` and `ParquetSink`.
parquet = [
    "pyarrow>=15.0",
]
# HuggingFace Hub I/O: `HuggingFaceSource` and `HubSink`.
hub = [
    "datasets>=3.0",
    "huggingface-hub>=0.25",
]
all = [
    "datafast[parquet,hub]",
]
dev = [
    "datafast[parquet,hub]",
    "pytest>=6.0",
    "ruff>=0.9.0",
]
docs = [
    # Zensical replaces mkdocs + mkdocs-material, which goes end-of-life on
    # 2026-11-05. Same maintainers, reads mkdocs.yml natively, renders the same
    # Material theme, and supports the mkdocstrings plugin directly.
    "zensical>=0.0.55",
    "pymdown-extensions>=10.0.0",
    # docs/api.md is `:::` directives only — without this it renders as raw text.
    "mkdocstrings[python]>=0.26",
]
langfuse = [
    "langfuse",
]

[tool.setuptools.packages.find]
include = ["datafast*"]

# PEP 561: without this marker in the wheel, a type checker ignores every
# annotation in the package.
[tool.setuptools.package-data]
datafast = ["py.typed"]

[tool.ruff]
# Basic Ruff configuration
exclude = ["venv", ".venv", "build", "dist", "__pycache__"]
line-length = 88

[tool.ruff.lint]
# C4 (comprehensions), not the whole C family: C90 is mccabe complexity, and ten
# functions in the runner, the branch merge, the filter operators and the samplers
# sit above any threshold worth setting. Splitting them is a refactor with its own
# review, not a lint rule.
select = ["E", "F", "C4", "W"]
ignore = ["E501"]


[project.urls]
"Documentation" = "https://patrickfleith.github.io/datafast/"
"Issue Tracker" = "https://github.com/patrickfleith/datafast/issues"
"Discussions" = "https://github.com/patrickfleith/datafast/discussions"
